<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Alunos</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">Aula 12</p>
      <h1>Cadastro de Alunos</h1>
      <p class="subtitulo">Cadastre alunos, pesquise pelo nome e dê duplo clique em uma linha para removê-la.</p>
    </header>

    <section class="card" aria-labelledby="titulo-cadastro">
      <h2 id="titulo-cadastro">Novo aluno</h2>
      <form id="form-aluno" novalidate>
        <div class="campos">
          <label for="nome">Nome
            <input id="nome" name="nome" type="text" placeholder="Ex.: Ana Souza" autocomplete="off">
          </label>

          <label for="nota">Nota
            <input id="nota" name="nota" type="number" min="0" max="10" step="0.1" placeholder="0 a 10">
          </label>

          <button type="submit">Cadastrar</button>
        </div>
      </form>
      <p id="aviso" class="aviso" role="status" aria-live="polite"></p>
    </section>

    <section class="card" aria-labelledby="titulo-turma">
      <div class="cabecalho-turma">
        <div>
          <h2 id="titulo-turma">Turma cadastrada</h2>
          <p class="instrucao">Use a busca para filtrar os nomes.</p>
        </div>
        <label class="busca-label" for="busca">Buscar aluno
          <input id="busca" name="busca" type="search" placeholder="Digite um nome..." autocomplete="off">
        </label>
      </div>

      <p id="vazio" class="vazio" hidden>Nenhum aluno cadastrado.</p>

      <div class="tabela-container">
        <table id="quadro">
          <thead>
            <tr>
              <th scope="col">Nome</th>
              <th scope="col">Média</th>
              <th scope="col">Situação</th>
            </tr>
          </thead>
          <tbody id="tabela"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
